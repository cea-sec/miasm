name: Miasm regression tests

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.13']

    steps:

    - name: Git checkout
      uses: actions/checkout@v3

    - name: Use Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Update pip
      run: pip install pip --upgrade

    - name: Install Miasm
      uses: ./.github/actions/install

    - name: Base tests
      run: cd test; python -W error test_all.py

    - name: Extended tests
      run: |
        cd miasm-extended-tests
        
        cd ir_tests && ./run.sh
        cd ../loader && python test_dll.py
        cd ../ls_x64 && ./run.sh ../..

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:

    - name: Git checkout
      uses: actions/checkout@v3

    - name: Use Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Update pip
      run: python -m pip install pip --upgrade
      shell: bash

    - name: Install Miasm
      uses: ./.github/actions/install

    - name: Windows tests
      run: cd test; python -W error test_all.py -t gcc
      shell: bash

  macos-aarch64:
    runs-on: macos-26
    strategy:
      matrix:
        python-version: ['3.13']

    steps:

    - name: Git checkout
      uses: actions/checkout@v3

    - name: Use Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Show host architecture
      run: python -c "import platform; print(platform.platform()); print(platform.machine())"

    - name: Update pip
      run: python -m pip install pip --upgrade

    - name: Install Miasm
      uses: ./.github/actions/install

    - name: macOS tests
      run: cd test; python -W error test_all.py -t gcc,llvm,qemu,long
